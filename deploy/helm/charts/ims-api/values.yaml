tenant:
  name: tenant-xyz
  slug: tenant-xyz

serviceAccount:
  create: true
  name: tenant-xyz-app

ingress:
  enabled: true
  className: nginx
  path: /
  pathType: Prefix
  annotations: {}

config:
  NODE_ENV: dev
  DB_HOST: "173.249.8.56"
  DB_PORT: "5432"
  DB_USER: "root"
  DB_NAME: "ims-user"
  REDIS_HOST: "redis-master.ims.svc.cluster.local"
  REDIS_PORT: "6379"
  KAFKA_BROKERS: "YOUR_EXTERNAL_KAFKA:9092"

secretRefs:
  existingSecretName: ims-db-secret

imsApi:
  enabled: true
  replicaCount: 2
  image:
    repository: joforrester/ims-api
    tag: "latest"
    pullPolicy: Always
  service:
    port: 3000
  containerPort: 3000
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "1"
      memory: "1Gi"
  probes:
    liveness:
      path: /getHealth
      initialDelaySeconds: 120
      periodSeconds: 10
    readiness:
      path: /getStatus
      initialDelaySeconds: 10
      periodSeconds: 5
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 20
    targetCPUUtilizationPercentage: 60

workerApi:
  enabled: false
  replicaCount: 1
  image:
    repository: joforrester/worker-api
    tag: "latest"
    pullPolicy: Always
  containerPort: 3001
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "1"
      memory: "1Gi"
  probes:
    liveness:
      path: /getHealth
      initialDelaySeconds: 120
      periodSeconds: 10
    readiness:
      path: /getStatus
      initialDelaySeconds: 10
      periodSeconds: 5
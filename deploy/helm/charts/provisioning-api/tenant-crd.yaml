apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: tenants.ims.example.com
spec:
  group: ims.example.com
  scope: Namespaced
  names:
    plural: tenants
    singular: tenant
    kind: Tenant
    shortNames: ["tnt"]
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: TenantNS
          type: string
          jsonPath: .spec.namespace
        - name: Slug
          type: string
          jsonPath: .spec.slug
        - name: Phase
          type: string
          jsonPath: .status.phase
      schema:
        openAPIV3Schema:
          type: object
          required: ["spec"]
          properties:
            spec:
              type: object
              required: ["namespace", "slug", "imsApi", "workerApi", "env", "secretRefs"]
              properties:
                namespace:
                  type: string
                  pattern: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$"
                slug:
                  type: string
                  pattern: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$"

                ingress:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                      default: true
                    className:
                      type: string
                      default: "nginx"
                    pathPrefix:
                      type: string
                      description: "Path prefix like /acme"
                    rewrite:
                      type: object
                      properties:
                        enabled:
                          type: boolean
                          default: true

                imsApi:
                  type: object
                  required: ["image", "replicas", "serviceAccountName", "containerPort"]
                  properties:
                    image:
                      type: string
                      minLength: 1
                    replicas:
                      type: integer
                      minimum: 1
                      maximum: 50
                    serviceAccountName:
                      type: string
                      pattern: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$"
                    containerPort:
                      type: integer
                      minimum: 1
                      maximum: 65535
                    resources:
                      type: object
                      properties:
                        requests:
                          type: object
                          properties:
                            cpu: { type: string }
                            memory: { type: string }
                        limits:
                          type: object
                          properties:
                            cpu: { type: string }
                            memory: { type: string }

                workerApi:
                  type: object
                  required: ["image", "replicas", "serviceAccountName", "containerPort"]
                  properties:
                    image:
                      type: string
                      minLength: 1
                    replicas:
                      type: integer
                      minimum: 0
                      maximum: 50
                    serviceAccountName:
                      type: string
                      pattern: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$"
                    containerPort:
                      type: integer
                      minimum: 1
                      maximum: 65535
                    resources:
                      type: object
                      properties:
                        requests:
                          type: object
                          properties:
                            cpu: { type: string }
                            memory: { type: string }
                        limits:
                          type: object
                          properties:
                            cpu: { type: string }
                            memory: { type: string }

                # env is a true map/dictionary, so additionalProperties belongs here
                env:
                  type: object
                  additionalProperties:
                    type: string

                secretRefs:
                  type: object
                  required: ["dbSecretName"]
                  properties:
                    dbSecretName:
                      type: string
                      pattern: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$"
                    kafkaSecretName:
                      type: string
                      pattern: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$"

            status:
              type: object
              properties:
                phase: { type: string }
                message: { type: string }
                observedGeneration: { type: integer }
                lastReconcileTime:
                  type: string
                  format: date-time
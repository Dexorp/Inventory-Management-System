apiVersion: v1
kind: Service
metadata:
  name: {{ include "ims.imsApiName" . }}
  labels:
    {{- include "ims.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "ims.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: ims-api
  ports:
    - name: http
      port: {{ .Values.imsApi.service.port }}
      targetPort: http
      protocol: TCP
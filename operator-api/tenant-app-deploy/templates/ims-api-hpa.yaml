{{- if .Values.imsApi.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "ims.imsApiName" . }}-hpa
  labels:
    {{- include "ims.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "ims.imsApiName" . }}
  minReplicas: {{ .Values.imsApi.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.imsApi.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.imsApi.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
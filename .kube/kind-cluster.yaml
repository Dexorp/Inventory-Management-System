kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: ims-dev
networking:
  apiServerAddress: "127.0.0.1"
  apiServerPort:  6443
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
      - containerPort: 30080
        hostPort: 30080
        protocol: TCP
      - containerPort: 30443
        hostPort: 30443
        protocol: TCP
  - role: worker
  - role: worker
